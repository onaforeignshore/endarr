<!-- ui/pages/torrents.html -->
<div class="settings-section">
    <h2>Torrents</h2>
    <p class="section-note">All torrents tracked by Endarr.</p>

    <!-- Filters -->
    <div class="filters-bar" role="search" aria-label="Filter torrents">
        <div class="filter-group">
            <label for="filterStatus">Status</label>
            <select id="filterStatus" aria-label="Filter by status">
                <option value="">All</option>
                <option value="active">Active (not deleted)</option>
                <option value="deleted">Deleted</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterCategory">Category</label>
            <select id="filterCategory" aria-label="Filter by category">
                <option value="__all__">All</option>
                <option value="sonarr">Sonarr</option>
                <option value="radarr">Radarr</option>
                <option value="lidarr">Lidarr</option>
                <option value="__empty__">None</option>
            </select>
        </div>
        <button id="refreshBtn" class="secondary-btn" aria-label="Refresh torrent list"><i class="fas fa-sync-alt" aria-hidden="true"></i> Refresh</button>
    </div>

    <!-- Torrents Table -->
    <div class="table-scrollable" role="region" aria-label="Torrents list" tabindex="0">
        <table class="data-table" role="table" aria-label="Tracked torrents">
            <thead>
                <tr role="row">
                    <th scope="col" role="columnheader">Name</th>
                    <th scope="col" role="columnheader">Category</th>
                    <th scope="col" role="columnheader">Added</th>
                    <th scope="col" role="columnheader">Imported</th>
                    <th scope="col" role="columnheader">Status</th>
                    <th scope="col" role="columnheader">Actions</th>
                </tr>
            </thead>
            <tbody id="torrentsTableBody">
                <tr><td colspan="6" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" role="navigation" aria-label="Pagination">
        <button id="prevPage" class="secondary-btn" disabled aria-label="Previous page"><i class="fas fa-chevron-left" aria-hidden="true"></i> Previous</button>
        <span id="pageInfo" aria-live="polite">Page 1</span>
        <button id="nextPage" class="secondary-btn" aria-label="Next page">Next <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        <!-- Page Size Selector -->
        <select id="pageSizeSelect" class="page-size-select" aria-label="Items per page">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
        </select>
    </div>
</div>
