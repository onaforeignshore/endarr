<!-- ui/pages/downloads.html -->
<div class="settings-section">
    <h2>Downloads</h2>
    <p class="section-note">Torrents that have been imported by ARR apps.</p>

    <!-- Downloads Table -->
    <div class="table-scrollable" role="region" aria-label="Downloads list" tabindex="0">
        <table class="data-table" role="table" aria-label="Imported torrents">
            <thead>
                <tr role="row">
                    <th scope="col" role="columnheader">Release Title</th>
                    <th scope="col" role="columnheader">Category</th>
                    <th scope="col" role="columnheader">Import Completed</th>
                    <th scope="col" role="columnheader">Deleted At</th>
                    <th scope="col" role="columnheader">Delete Reason</th>
                    <th scope="col" role="columnheader">Current State</th>
                </tr>
            </thead>
            <tbody id="downloadsTableBody">
                <tr><td colspan="6" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" role="navigation" aria-label="Pagination">
        <button id="prevPage" class="secondary-btn" disabled aria-label="Previous page"><i class="fas fa-chevron-left" aria-hidden="true"></i> Previous</button>
        <span id="pageInfo" aria-live="polite">Page 1</span>
        <button id="nextPage" class="secondary-btn" aria-label="Next page">Next <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        <!-- Page Size Selector -->
        <select id="pageSizeSelect" class="page-size-select" aria-label="Items per page">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
        </select>
    </div>
</div>
