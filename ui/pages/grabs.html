<!-- ui/pages/grabs.html -->
<div class="settings-section">
    <h2>Grabs</h2>
    <p class="section-note">All grab events received from ARR webhooks.</p>

    <!-- Filters -->
    <div class="filters-bar" role="search" aria-label="Filter grabs">
        <div class="filter-group">
            <label for="filterArr">ARR</label>
            <select id="filterArr" aria-label="Filter by ARR client">
                <option value="">All</option>
                <option value="radarr">Radarr</option>
                <option value="sonarr">Sonarr</option>
                <option value="lidarr">Lidarr</option>
            </select>
        </div>
        <button id="refreshBtn" class="secondary-btn" aria-label="Refresh grabs list" title="Refresh the list">
            <i class="fas fa-sync-alt" aria-hidden="true"></i> Refresh
        </button>
    </div>

    <!-- Grabs Table -->
    <div class="table-scrollable" role="region" aria-label="Grabs list" tabindex="0">
        <table class="data-table" role="table" aria-label="Tracked grab events">
            <thead>
                <tr role="row">
                    <th scope="col" role="columnheader">Release Title</th>
                    <th scope="col" role="columnheader">ARR</th>
                    <th scope="col" role="columnheader">Media Type</th>
                    <th scope="col" role="columnheader">Indexer</th>
                    <th scope="col" role="columnheader">Quality</th>
                    <th scope="col" role="columnheader">Size</th>
                    <th scope="col" role="columnheader">Grabbed At</th>
                    <th scope="col" role="columnheader">Status</th>
                </tr>
            </thead>
            <tbody id="grabsTableBody">
                <tr><td colspan="8" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" role="navigation" aria-label="Pagination">
        <button id="prevPage" class="secondary-btn" disabled aria-label="Previous page"><i class="fas fa-chevron-left" aria-hidden="true"></i> Previous</button>
        <span id="pageInfo" aria-live="polite">Page 1</span>
        <button id="nextPage" class="secondary-btn" aria-label="Next page">Next <i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        <!-- Page Size Selector -->
        <select id="pageSizeSelect" class="page-size-select" aria-label="Items per page">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
        </select>
    </div>
</div>
